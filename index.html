<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - RIZKY 4D</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            text-align: center;
            padding: 20px;
        }

        .maintenance {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .brand {
            font-weight: bold;
            font-size: 20px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 30px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="maintenance">
        <div class="icon">🔧</div>

        <div class="brand">RIZKY 4D</div>

        <h1>SEDANG MAINTENANCE</h1>

        <p>
            Mohon maaf, situs kami sedang dalam proses perbaikan
            dan pembaruan. Silakan kembali lagi nanti.
        </p>

        <div class="status">
            ⚙️ Sedang diperbaiki
        </div>
    </div>

</body>
</html>
